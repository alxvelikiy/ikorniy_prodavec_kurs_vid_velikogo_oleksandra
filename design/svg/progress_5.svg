<div class="dgm dgm-progress">
<style>
.dgm-progress{
  --paper:#F3EFE6; --ink:#14110F; --muted:#5F584F; --rule:#BDB5A6; --roe:#B8341A; --ice:#DFE5E2;
  background:var(--paper); font-family:'Roboto Flex',sans-serif; max-width:100%;
}
@media (prefers-color-scheme: dark){
  .dgm-progress:not([data-theme="light"]){ --paper:#12100E; --ink:#EDE7DB; --muted:#A39B8E; --rule:#3A342D; --roe:#F0643A; --ice:#1B211F; }
}
.dgm-progress[data-theme="dark"]{ --paper:#12100E; --ink:#EDE7DB; --muted:#A39B8E; --rule:#3A342D; --roe:#F0643A; --ice:#1B211F; }
.dgm-progress svg{display:block;width:100%;height:auto;max-width:100%}
.dgm-progress svg.v-mobile{display:none}
@media (max-width:640px){
  .dgm-progress svg.v-desktop{display:none}
  .dgm-progress svg.v-mobile{display:block}
}
.dgm-progress rect.bg{fill:var(--paper)}
.dgm-progress .tick{stroke:var(--rule);stroke-width:1;vector-effect:non-scaling-stroke}
.dgm-progress .seg{fill:var(--ink)}
.dgm-progress .seg-final{fill:var(--roe)}
.dgm-progress .load{fill:url(#ht-prog5)}
.dgm-progress .load-m{fill:url(#ht-prog5-m)}
.dgm-progress .num-on-dark{fill:var(--paper)}
.dgm-progress .ink{fill:var(--ink)}
.dgm-progress .muted{fill:var(--muted)}
.dgm-progress .roe{fill:var(--roe)}
.dgm-progress .name{font-family:'Roboto Flex',sans-serif;font-weight:500;font-stretch:100%}
.dgm-progress .mono{font-family:'Martian Mono',monospace;font-stretch:87.5%;letter-spacing:.04em;text-transform:uppercase}
.dgm-progress .take{font-family:'Roboto Flex',sans-serif;font-size:1rem;line-height:1.5;color:var(--ink);margin:.9em .1em 0;max-width:64ch}
.dgm-progress .take b{color:var(--roe);font-weight:700}
</style>

<svg class="v-desktop" viewBox="0 0 1300 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Прогресс 5 дней курса: какие критерии вводятся и сколько критериев в работе к каждому дню, норма 75 звонков в день">
  <defs>
    <pattern id="ht-prog5" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="0.9" style="fill:var(--ink)"/>
    </pattern>
  </defs>
  <rect class="bg" x="0" y="0" width="1300" height="380"/>
  <text class="mono muted" x="50" y="24" font-size="12">НОРМА 75 ЗВОНКОВ / ДЕНЬ — ЕДИНАЯ, С ДНЯ 1</text>

  <!-- растровые столбики: сколько критериев из 12 в работе к концу дня (высота 90 = 12 критериев) -->
  <text class="mono muted" x="50" y="58" font-size="10">КРИТЕРИЕВ В РАБОТЕ</text>
  <rect class="load" x="140" y="157.5" width="60" height="22.5"/>
  <rect class="load" x="380" y="142.5" width="60" height="37.5"/>
  <rect class="load" x="620" y="120" width="60" height="60"/>
  <rect class="load" x="860" y="97.5" width="60" height="82.5"/>
  <rect class="load" x="1100" y="90" width="60" height="90"/>
  <g class="mono ink" font-size="13" text-anchor="middle">
    <text x="170" y="150">3</text>
    <text x="410" y="135">5</text>
    <text x="650" y="112">8</text>
    <text x="890" y="90">11</text>
  </g>
  <text class="mono roe" x="1130" y="82" font-size="13" text-anchor="middle">12</text>

  <!-- засечки -->
  <g class="tick">
    <line x1="50" y1="195" x2="50" y2="260"/><line x1="290" y1="195" x2="290" y2="260"/>
    <line x1="530" y1="195" x2="530" y2="260"/><line x1="770" y1="195" x2="770" y2="260"/>
    <line x1="1010" y1="195" x2="1010" y2="260"/><line x1="1250" y1="195" x2="1250" y2="260"/>
  </g>

  <!-- сегменты: дни 1–4 сплошные, день 5 (аттестация) — акцент -->
  <rect class="seg" x="52" y="200" width="236" height="50"/>
  <rect class="seg" x="292" y="200" width="236" height="50"/>
  <rect class="seg" x="532" y="200" width="236" height="50"/>
  <rect class="seg" x="772" y="200" width="236" height="50"/>
  <rect class="seg-final" x="1012" y="200" width="236" height="50"/>

  <g class="mono num-on-dark" font-size="16" text-anchor="middle">
    <text x="170" y="232">ДЕНЬ 01</text>
    <text x="410" y="232">ДЕНЬ 02</text>
    <text x="650" y="232">ДЕНЬ 03</text>
    <text x="890" y="232">ДЕНЬ 04</text>
    <text x="1130" y="232">ДЕНЬ 05</text>
  </g>

  <g class="name ink" font-size="13" text-anchor="middle">
    <text x="170" y="282">Быстрый старт:</text><text x="170" y="299">заход, крючок, этапы</text>
    <text x="410" y="282">Возражения</text><text x="410" y="299">и закрытие</text>
    <text x="650" y="282">Работа с базой:</text><text x="650" y="299">персонализация, УТП, спуск</text>
    <text x="890" y="282">Звучание, чистота</text><text x="890" y="299">речи и продукт</text>
  </g>
  <g class="name roe" font-size="13" text-anchor="middle">
    <text x="1130" y="282">Финал звонка</text><text x="1130" y="299">и самопроверка</text>
  </g>

  <g class="mono muted" font-size="10" text-anchor="middle">
    <text x="170" y="322">К-01 К-02 К-05</text>
    <text x="410" y="322">К-11 К-10</text>
    <text x="650" y="322">К-06 К-07 К-08</text>
    <text x="890" y="322">К-03 К-04 К-12</text>
  </g>
  <text class="mono roe" x="1130" y="322" font-size="10" text-anchor="middle">К-09 · ВСЕ 12</text>
</svg>

<svg class="v-mobile" viewBox="0 0 420 880" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Прогресс 5 дней курса, вертикальная раскладка">
  <defs>
    <pattern id="ht-prog5-m" width="5" height="5" patternUnits="userSpaceOnUse">
      <circle cx="2.5" cy="2.5" r="0.9" style="fill:var(--ink)"/>
    </pattern>
  </defs>
  <rect class="bg" x="0" y="0" width="420" height="880"/>
  <text class="mono muted" x="20" y="22" font-size="10">НОРМА 75 ЗВОНКОВ / ДЕНЬ — ЕДИНАЯ</text>

  <!-- сегменты по вертикали, шаг 165 -->
  <rect class="seg" x="20" y="40" width="34" height="150"/>
  <rect class="seg" x="20" y="205" width="34" height="150"/>
  <rect class="seg" x="20" y="370" width="34" height="150"/>
  <rect class="seg" x="20" y="535" width="34" height="150"/>
  <rect class="seg-final" x="20" y="700" width="34" height="150"/>

  <g class="mono num-on-dark" font-size="14" text-anchor="middle">
    <text x="37" y="120">01</text><text x="37" y="285">02</text><text x="37" y="450">03</text>
    <text x="37" y="615">04</text><text x="37" y="780">05</text>
  </g>

  <g class="name ink" font-size="15">
    <text x="70" y="72">Быстрый старт:</text><text x="70" y="92">заход, крючок, этапы</text>
    <text x="70" y="237">Возражения</text><text x="70" y="257">и закрытие</text>
    <text x="70" y="402">Работа с базой:</text><text x="70" y="422">персонализация, УТП, спуск</text>
    <text x="70" y="567">Звучание, чистота</text><text x="70" y="587">речи и продукт</text>
  </g>
  <g class="name roe" font-size="15">
    <text x="70" y="732">Финал звонка</text><text x="70" y="752">и самопроверка</text>
  </g>

  <g class="mono muted" font-size="10">
    <text x="70" y="114">К-01 К-02 К-05</text>
    <text x="70" y="279">К-11 К-10</text>
    <text x="70" y="444">К-06 К-07 К-08</text>
    <text x="70" y="609">К-03 К-04 К-12</text>
  </g>
  <text class="mono roe" x="70" y="774" font-size="10">К-09 · ВСЕ 12</text>

  <!-- растровая полоса нагрузки: ширина 180 = 12 критериев -->
  <g class="mono muted" font-size="9">
    <text x="70" y="140">В РАБОТЕ: 3 ИЗ 12</text>
    <text x="70" y="305">В РАБОТЕ: 5 ИЗ 12</text>
    <text x="70" y="470">В РАБОТЕ: 8 ИЗ 12</text>
    <text x="70" y="635">В РАБОТЕ: 11 ИЗ 12</text>
  </g>
  <text class="mono roe" x="70" y="800" font-size="9">В РАБОТЕ: 12 ИЗ 12</text>
  <rect class="load-m" x="70" y="148" width="45" height="12"/>
  <rect class="load-m" x="70" y="313" width="75" height="12"/>
  <rect class="load-m" x="70" y="478" width="120" height="12"/>
  <rect class="load-m" x="70" y="643" width="165" height="12"/>
  <rect class="load-m" x="70" y="808" width="180" height="12"/>
</svg>

<p class="take">Что запомнить: <b>норма 75 звонков в день не меняется ни разу за 5 дней</b> — растёт только число критериев, которые нужно удерживать одновременно: 3, 5, 8, 11, все 12.</p>
</div>
